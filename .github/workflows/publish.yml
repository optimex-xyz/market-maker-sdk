name: Publish Package

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Release Please for main branch - creates Release PR
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

  # Publish stable version when Release PR is merged
  publish-stable:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      - name: Get package info
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        run: npm publish --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Send Telegram Notification
        if: success()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.BF_DEVOPS_CHANNEL_ID }}
          token: ${{ secrets.BF_MONITOR_BOT }}
          message: |
            🚀 NPM Package Published

            📌 Package: ${{ steps.package.outputs.name }}
            📌 Version: ${{ steps.package.outputs.version }}
            📌 Tag: latest

            👤 Triggered by: ${{ github.actor }}

            🔗 Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Publish beta version on develop branch
  publish-beta:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      - name: Get short commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get package info
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish beta version
        run: |
          SHORT_SHA=${{ steps.commit.outputs.short }}
          CURRENT_VERSION=${{ steps.package.outputs.version }}
          BETA_VERSION="${CURRENT_VERSION}-beta.${SHORT_SHA}"

          npm version "$BETA_VERSION" --no-git-tag-version
          echo "Publishing ${{ steps.package.outputs.name }}@${BETA_VERSION}"
          npm publish --access public --provenance --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Send Telegram Notification
        if: success()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.BF_DEVOPS_CHANNEL_ID }}
          token: ${{ secrets.BF_MONITOR_BOT }}
          message: |
            🧪 NPM Beta Package Published

            📌 Package: ${{ steps.package.outputs.name }}
            📌 Version: ${{ steps.package.outputs.version }}-beta.${{ steps.commit.outputs.short }}
            📌 Tag: beta

            👤 Triggered by: ${{ github.actor }}

            🔗 Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
